[project]
name = "stats-badge"
version = "0.1.0"
description = "System stats from a host PC, drawn on a Badgeware badge"
readme = "../README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
dependencies = ["psutil>=5.9"]

[project.optional-dependencies]
nvidia = ["nvidia-ml-py>=12"]
install = ["mpremote>=1.22", "pyserial>=3.5"]
all = ["nvidia-ml-py>=12", "mpremote>=1.22", "pyserial>=3.5"]

[project.scripts]
statsbadge = "statsbadge.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["statsbadge*"]

[tool.setuptools.package-data]
statsbadge = ["web/*"]

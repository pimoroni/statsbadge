[project]
name = "statsbadge-clock"
version = "0.1.0"
description = "A Swiss railway clock and weather page for statsbadge"
readme = "README.md"
authors = [
    { name = "Philip Howard", email = "phil@pimoroni.com" },
]
license = "MIT"
requires-python = ">=3.11"
dependencies = ["statsbadge"]

# The whole extension mechanism is this one entry point: the server finds the class,
# runs it as a source, and can push its badge-side module to the badge.
[project.entry-points."statsbadge.sources"]
clock = "statsbadge_clock:Clock"

[build-system]
requires = ["uv_build>=0.11.23,<0.12.0"]
build-backend = "uv_build"

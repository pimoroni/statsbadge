[project]
name = "statsbadge-clock"
dynamic = ["version"]
description = "A Swiss railway clock and weather page for statsbadge"
readme = "README.md"
authors = [
    { name = "Philip Howard", email = "phil@pimoroni.com" },
]
license = "MIT"
requires-python = ">=3.11"
dependencies = ["statsbadge>=3.0.0"]

[project.urls]
Homepage = "https://github.com/pimoroni/statsbadge/tree/main/extensions/statsbadge-clock"
Repository = "https://github.com/pimoroni/statsbadge"
Issues = "https://github.com/pimoroni/statsbadge/issues"

[project.entry-points."statsbadge.sources"]
clock = "statsbadge_clock:Clock"

# The tag is the version: one vN.N.N tag releases statsbadge and every extension in this
# repository at N.N.N.
[tool.hatch.version]
source = "uv-dynamic-versioning"

[tool.hatch.build.targets.wheel]
packages = ["src/statsbadge_clock"]

[build-system]
requires = ["hatchling", "uv-dynamic-versioning"]
build-backend = "hatchling.build"

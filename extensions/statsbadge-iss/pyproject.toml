[project]
name = "statsbadge-iss"
dynamic = ["version"]
description = "Where the space station is, for statsbadge"
readme = "README.md"
authors = [
    { name = "Philip Howard", email = "phil@pimoroni.com" },
]
license = "MIT"
requires-python = ">=3.11"
dependencies = ["statsbadge"]

[project.urls]
Homepage = "https://github.com/pimoroni/statsbadge/tree/main/extensions/statsbadge-iss"
Repository = "https://github.com/pimoroni/statsbadge"
Issues = "https://github.com/pimoroni/statsbadge/issues"

# The whole extension mechanism is this one entry point: the server finds the class,
# runs it as a source, and can push its badge-side module to the badge.
[project.entry-points."statsbadge.sources"]
iss = "statsbadge_iss:ISS"

# The tag is the version, and this package's tags carry its own prefix so a release of one
# extension is not a release of the others: iss-v0.2.0 is this one at 0.2.0.
[tool.hatch.version]
source = "uv-dynamic-versioning"

[tool.uv-dynamic-versioning]
pattern-prefix = "iss-"

[tool.hatch.build.targets.wheel]
packages = ["src/statsbadge_iss"]

[build-system]
requires = ["hatchling", "uv-dynamic-versioning"]
build-backend = "hatchling.build"

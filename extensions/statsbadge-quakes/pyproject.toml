[project]
name = "statsbadge-quakes"
version = "0.1.0"
description = "Recent earthquakes on a world map, for statsbadge"
readme = "README.md"
authors = [
    { name = "Philip Howard", email = "phil@pimoroni.com" },
]
license = "MIT"
requires-python = ">=3.11"
dependencies = ["statsbadge"]

[project.entry-points."statsbadge.sources"]
quakes = "statsbadge_quakes:Quakes"

[build-system]
requires = ["uv_build>=0.11.23,<0.12.0"]
build-backend = "uv_build"

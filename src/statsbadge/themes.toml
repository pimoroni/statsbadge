# Built from the chosen accent rather than written down. `shape` names a set of levels in
# derive.SHAPES; `bold` holds the ramp in the accent's hue instead of sending it to red.

["tinted-dark"]
label = "Tinted"
pair = "tinted-light"
derived = { shape = "dark" }

["tinted-light"]
label = "Tinted"
pair = "tinted-dark"
derived = { shape = "light" }

["tinted-bold-dark"]
label = "Tinted Bold"
pair = "tinted-bold-light"
derived = { shape = "dark", bold = true }

["tinted-bold-light"]
label = "Tinted Bold"
pair = "tinted-bold-dark"
derived = { shape = "light", bold = true }

["tinted-glow-dark"]
label = "Tinted Glow"
pair = "tinted-glow-light"
derived = { shape = "glow-dark", bold = true }

["tinted-glow-light"]
label = "Tinted Glow"
pair = "tinted-glow-dark"
derived = { shape = "glow-light", bold = true }

# Palettes that are now the derived pair with an accent, and the tinted names that carried a
# ramp choice. A stored name still resolves, so a badge showing one carries on showing it.
#
# `hue` is taken from the saturated family, where each of those palettes had its accent:
# measured, all five sat within 0.003 of their hue's chroma limit.

[aliases]
red = { theme = "tinted-bold-dark", hue = 30 }
green = { theme = "tinted-bold-dark", hue = 150 }
cyan = { theme = "tinted-bold-dark", hue = 210 }
amber = { theme = "tinted-bold-dark", hue = 60 }
blueprint = { theme = "tinted-bold-dark", hue = 240 }

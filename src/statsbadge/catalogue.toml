# The extensions this project publishes, so the config UI can offer them by name.
#
# A list, not a search: PyPI has no reliable way to ask "what is a statsbadge extension",
# and a name typed into the free-form box installs just as well. Anything here that has
# been taken off PyPI fails to install, and says so.
#
#   summary   one line, in the UI's own words
#   page      ships badge-side code, so its page needs `statsbadge install` over USB
#   needs     what it has to be told before it reports anything

[clock]
summary = "A Swiss railway clock, with the weather where you are"
page = true

[iss]
summary = "Where the space station is, on a world map"
page = true

[quakes]
summary = "Recent earthquakes on a world map"
page = true

[mastodon]
summary = "Your Mastodon timeline, and what your account is doing"
needs = "an access token"

[bluesky]
summary = "A Bluesky account, its posts and a feed"

[cloudflare]
summary = "Cloudflare web traffic, a group per domain"
needs = "an API token"

[octopus]
summary = "Octopus Energy half-hourly prices and meter readings"
needs = "an API key"

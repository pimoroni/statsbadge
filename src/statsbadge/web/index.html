<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>statsbadge</title>
<link rel="stylesheet" href="/app.css">
</head>
<body>
<header>
  <h1>statsbadge</h1>
  <div class="host" id="hostline">loading&hellip;</div>
  <button id="save" class="primary" disabled>Save to badge</button>
</header>

<main>
  <div class="column">
    <h2>Pages</h2>
    <div class="row">
      <select id="addkind">
        <option value="dial">Dial</option>
        <option value="bars">Bars</option>
        <option value="graph">Graph</option>
        <option value="grid">Grid</option>
        <option value="text">Text</option>
      </select>
      <button id="add">Add page</button>
    </div>
    <ol id="pages" class="pages"></ol>
    <div id="pruned" class="warn hidden"></div>
  </div>

  <div class="column">
    <h2>Look</h2>
    <section class="col">
      <label>Theme
        <select id="theme"></select>
      </label>
      <div class="swatches" id="swatches"></div>
      <label>Refresh
        <input type="range" id="interval" min="250" max="5000" step="250">
        <output id="intervalout"></output>
      </label>
      <label>Brightness
        <input type="range" id="brightness" min="5" max="100" step="5">
        <output id="brightnessout"></output>
      </label>
      <label>Graph points
        <input type="range" id="points" min="8" max="160" step="8">
        <output id="pointsout"></output>
      </label>
      <label>Case lights <select id="caselights"></select></label>
    </section>

    <h2>Buttons</h2>
    <section class="col">
      <p class="hint">A command runs on the host. Only bound commands are accepted.</p>
      <label>A <select id="btn-a" class="cmd"></select></label>
      <label>B <select id="btn-b" class="cmd"></select></label>
      <label>C <select id="btn-c" class="cmd"></select></label>
    </section>

    <h2>Badges</h2>
    <section class="col">
      <div id="badges"></div>
      <button id="pair" class="right">Pair a badge&hellip;</button>
      <div id="pairing" class="pairing hidden"></div>
    </section>

    <h2>Extensions</h2>
    <section class="col" id="settings"></section>

    <h2>This Host</h2>
    <section class="col">
      <div id="sources" class="sources"></div>
    </section>
  </div>

  <div class="column">
    <h2>Live</h2>
    <div id="live" class="live"></div>
  </div>
</main>

<script src="/app.js"></script>
</body>
</html>

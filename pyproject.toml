[project]
name = "statsbadge"
dynamic = ["version"]
description = "System stats from a host PC, drawn on a Badgeware badge"
readme = "README.md"
authors = [
    { name = "Philip Howard", email = "phil@pimoroni.com" },
]
maintainers = [
    { name = "Philip Howard", email = "phil@pimoroni.com" },
]
license = "MIT"
# The vendored .af fonts are built from OFL originals, and the raw REPL in repl.py follows
# MicroPython's implementation, so those licences travel with the wheel carrying them.
#
# The badge copy of a font goes without: a licence is for whoever redistributes it, and the
# badge is where it is used.
license-files = ["LICENSE", "licences/*.txt"]
requires-python = ">=3.11"
dependencies = [
    "psutil>=5.9",
    # Decoding a feed's pictures for `imaging`. A JPEG decoder is the one part of this
    # not worth writing, and a host with no display is the ordinary case here.
    "pillow>=10",
    # Finding the badge's port and talking to its REPL. Kept out of the extras, since
    # `statsbadge install` has to work from a plain install.
    "pyserial>=3.5",
    # The tray icon, which draws from a PIL image. Not an extra: an install missing it
    # left `statsbadge tray` serving with no icon, and the reason for that is not
    # something anyone should have to go looking for.
    #
    # It declares its own platform bits, so only macOS pays for it: pyobjc at 28MB there,
    # python-xlib at 1MB on Linux, ctypes and nothing at all on Windows.
    "pystray>=0.19.5",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Topic :: System :: Monitoring",
]

[project.optional-dependencies]
# NVIDIA cards, via the same library nvidia-smi uses.
nvidia = ["nvidia-ml-py>=12"]

[project.urls]
Homepage = "https://github.com/pimoroni/statsbadge"
Repository = "https://github.com/pimoroni/statsbadge"
Issues = "https://github.com/pimoroni/statsbadge/issues"

[project.scripts]
statsbadge = "statsbadge.__main__:main"

# A launcher with no console window behind it, which the Windows Run key points
# at. Same as the console script on macOS and Linux.
[project.gui-scripts]
statsbadge-tray = "statsbadge.__main__:tray_main"

# `tests/` carries no __init__.py, so pytest puts it on sys.path and conftest.py is
# importable from a test file by name.
[tool.pytest.ini_options]
testpaths = ["tests"]

# The tag is the version. uv's build backend takes only static metadata, astral-sh/uv#11718
# being open, so the backend is hatchling. `uv build` and `uv publish` drive it the same
# way, those being the frontend.
[tool.hatch.version]
source = "uv-dynamic-versioning"

[tool.hatch.build.targets.wheel]
packages = ["src/statsbadge"]

# The precompiled app is gitignored as a build artefact, which hatchling leaves out unless
# told. Without this the wheel ships sources alone and the badge compiles at every launch.
# DEVELOPMENT.md has the timings.
[tool.hatch.build]
artifacts = ["src/statsbadge/badge_app/mpy/**"]

[build-system]
requires = ["hatchling", "uv-dynamic-versioning"]
build-backend = "hatchling.build"

[dependency-groups]
# mpremote for the on-badge tools, which run a script over a mounted checkout. `mpremote
# mount` is a filesystem protocol, and nothing statsbadge itself needs.
dev = [
    "ruff>=0.6",
    "mpremote>=1.22",
    "pytest>=8.0",
    # Reading the release workflows, which have to agree with each extension's pyproject.
    "pyyaml>=6.0.3",
]
# Building an extension's .af icon font. A group and not an extra, since nothing needs it
# to run or install: uv sync --group fonts.
fonts = ["freetype-py>=2.4", "shapely>=2.1"]
# The desktop apps. Kept separate, since it pulls a toolchain nothing else here needs:
# uv run --group packaging briefcase ...
packaging = ["briefcase>=0.4.4"]

# The example extension is kept out of the workspace. It declares a real dependency on
# statsbadge, which is correct once published but circular in a checkout, so it is
# installed for development with --no-deps. See README.

# -- packaged apps ----------------------------------------------------------
#
# Briefcase, not PyInstaller: everything goes in as a wheel, so `.dist-info` survives.
# `importlib.metadata` finds extensions and reports the version. A bundle without it has
# neither.

[tool.briefcase]
project_name = "statsbadge"
bundle = "com.pimoroni"
version = "0.0.0"
url = "https://github.com/pimoroni/statsbadge"
# Restated without the glob, which briefcase reads as a literal path. The font licences
# still travel in the wheel installed inside the bundle, which carries a copy.
license = "MIT"
license-files = ["LICENSE"]
# The publisher, and not the author of the code: the Windows installer puts the app in
# Program Files under this name, and macOS shows it as the one behind the bundle.
# `[project] authors` is who wrote it, and stays.
author = "Pimoroni"
author_email = "phil@pimoroni.com"

[tool.briefcase.app.statsbadge-tray]
formal_name = "statsbadge"
description = "System stats from a host PC, drawn on a Badgeware badge"
# The mark the tray and the badge draw, at the sizes each platform asks for. Written by
# tools/icon.py, so the app icon cannot drift from the one in the menu bar.
icon = "packaging/icons/icon"
sources = ["packaging/statsbadge_tray"]
requires = [
    ".",
    # The roots to verify a certificate against. The Python inside the bundle has none, so
    # without this every extension that fetches anything fails.
    "certifi",
    # What installs an extension. The app spawns itself to be `python -m pip`, there
    # being no interpreter in here to be one: 6MB against uv's 39.
    "pip",
    "./extensions/statsbadge-clock",
    "./extensions/statsbadge-iss",
    "./extensions/statsbadge-quakes",
]

[tool.briefcase.app.statsbadge-tray.macOS]
universal_build = false

# pyobjc ships a test suite and debug symbols beside it. Neither belongs in a bundle, and
# codesign rejects the .dSYM anyway.
cleanup_paths = [
    "{app.formal_name}.app/Contents/Resources/app_packages/PyObjCTest",
    "{app.formal_name}.app/Contents/Resources/app_packages/**/*.dSYM",
]

# No Dock icon and no application menu. This lives in the menu bar, where an app with
# nothing to show has no business taking a Dock slot.
[tool.briefcase.app.statsbadge-tray.macOS.info]
LSUIElement = true

[tool.briefcase.app.statsbadge-tray.windows]
console_app = false
# NVML, for a card the app would otherwise report nothing about. `requires` is cumulative
# in briefcase, so this is the app's list plus one. Windows only: no Mac has such a card.
requires = ["nvidia-ml-py>=12"]

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>statsbadge call graph</title>
<meta name="color-scheme" content="light dark">

<style>
/* The same tokens as index.html, which takes them from src/statsbadge/themes.py. The
   canvas does not read these - it gets its palette out of the JSON, from that same file -
   so the chrome and the drawing agree by construction rather than by being kept in step. */
:root {
  color-scheme: light dark;

  --bg: light-dark(#faf7f2, #12141c);
  --panel: light-dark(#f0ece4, #1a1e2b);
  --ink: light-dark(#1e1a14, #f2f5ff);
  --dim: light-dark(#665e52, #8b93ab);
  --accent: light-dark(#10919d, #38e8d1);
  --grid: light-dark(#d8d1c3, #2c3346);

  --ramp-0: light-dark(#10919d, #38e8d1);
  --ramp-1: light-dark(#51924a, #7ed375);
  --ramp-2: light-dark(#bc670c, #ec9f07);
  --ramp-3: light-dark(#8a0316, #d71908);

  --rail: 15rem;
  --detail: 21rem;
  --mono: ui-monospace, SFMono-Regular, Menlo, monospace;
}

* { box-sizing: border-box; }

html, body {
  height: 100%;
  margin: 0;
  overflow: hidden;
  background: var(--bg);
  color: var(--ink);
  font-family: system-ui, sans-serif;
  font-weight: 300;
  font-size: 14px;
  line-height: 1.5;
}

body {
  display: grid;
  grid-template-columns: var(--rail) 1fr var(--detail);
  grid-template-rows: auto 1fr auto;
  grid-template-areas: "head head head" "rail stage detail" "rail play detail";
}

/* -- header ---------------------------------------------------------------- */

header {
  grid-area: head;
  display: flex;
  align-items: center;
  gap: 1.1rem;
  padding: 0.5rem 0.9rem;
  border-bottom: 1px solid var(--grid);
  background: var(--panel);
}

h1 { margin: 0; font-size: 0.95rem; font-weight: 500; white-space: nowrap; }
h1 small { color: var(--dim); font-weight: 300; margin-left: 0.4rem; }

label { color: var(--dim); font-size: 0.8rem; }

select, input[type="search"], button {
  font: inherit;
  font-size: 0.82rem;
  color: var(--ink);
  background: var(--bg);
  border: 1px solid var(--grid);
  border-radius: 3px;
  padding: 0.15rem 0.4rem;
}
button { cursor: pointer; }
button:hover { border-color: var(--accent); color: var(--accent); }
select:focus-visible, input:focus-visible, button:focus-visible {
  outline: 2px solid var(--accent);
  outline-offset: 1px;
}

input[type="search"] { width: 11rem; }
input[type="range"] { width: 7rem; vertical-align: middle; accent-color: var(--accent); }

/* The ramp with the real value at each quarter: a colour has to be readable back to a
   number, and a percentile rank on its own is unmoored. */
#depth { display: flex; align-items: center; gap: 0.35rem; white-space: nowrap; }
#depth input[type="range"] { width: 5rem; }
#depth b {
  font-family: var(--mono);
  font-size: 0.72rem;
  font-weight: 400;
  color: var(--dim);
  min-width: 2.2rem;
}
#flip.on { background: var(--accent); color: var(--bg); border-color: var(--accent); }

#legend { display: flex; align-items: center; gap: 0.4rem; margin-left: auto; }
#ramp { width: 9rem; height: 0.55rem; border-radius: 3px; border: 1px solid var(--grid); }
#ticks {
  display: flex;
  justify-content: space-between;
  width: 9rem;
  font-family: var(--mono);
  font-size: 0.64rem;
  color: var(--dim);
}

/* -- rails ---------------------------------------------------------------- */

#rail { grid-area: rail; border-right: 1px solid var(--grid); }
#detail { grid-area: detail; border-left: 1px solid var(--grid); }

#rail, #detail {
  overflow-y: auto;
  overflow-x: hidden;
  padding: 0.7rem 0.8rem 3rem;
  background: var(--panel);
}

h2 {
  margin: 1.1rem 0 0.35rem;
  font-size: 0.7rem;
  font-weight: 500;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--dim);
}
#rail > h2:first-child, #detail > h2:first-child { margin-top: 0; }

.check {
  display: flex;
  align-items: center;
  gap: 0.4rem;
  padding: 0.06rem 0;
  cursor: pointer;
  font-size: 0.82rem;
}
.check input { accent-color: var(--accent); margin: 0; flex: none; }
.check span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.check .count { margin-left: auto; color: var(--dim); font-size: 0.72rem; flex: none; }
.check:hover { color: var(--accent); }

.slider { margin: 0.35rem 0 0.6rem; font-size: 0.78rem; color: var(--dim); }
.slider b { color: var(--ink); font-weight: 400; font-family: var(--mono); }

/* -- the stage ------------------------------------------------------------ */

#stage { grid-area: stage; position: relative; overflow: hidden; }
canvas { display: block; width: 100%; height: 100%; cursor: grab; }
canvas.dragging { cursor: grabbing; }

#tip {
  position: absolute;
  pointer-events: none;
  z-index: 5;
  max-width: 22rem;
  padding: 0.3rem 0.5rem;
  border: 1px solid var(--grid);
  border-radius: 3px;
  background: var(--panel);
  box-shadow: 0 2px 10px light-dark(#00000022, #00000088);
  font-size: 0.78rem;
  opacity: 0;
  transition: opacity 90ms;
}
#tip.on { opacity: 1; }
#tip b { font-weight: 500; font-family: var(--mono); }
#tip i { font-style: normal; color: var(--dim); }

#hud {
  position: absolute;
  left: 0.6rem;
  bottom: 0.5rem;
  pointer-events: none;
  font-family: var(--mono);
  font-size: 0.68rem;
  color: var(--dim);
}

/* -- the transport -------------------------------------------------------- */

#play {
  grid-area: play;
  display: flex;
  align-items: center;
  gap: 0.6rem;
  padding: 0.35rem 0.7rem;
  border-top: 1px solid var(--grid);
  background: var(--panel);
  font-size: 0.78rem;
}
#play button { min-width: 2rem; text-align: center; }
#play .check { width: auto; flex: none; font-size: 0.72rem; }
#play #scrub { flex: 1; min-width: 6rem; }
#play .what { color: var(--dim); font-size: 0.72rem; white-space: nowrap; }
#play .what b { color: var(--ink); font-weight: 400; }

/* A walk is a possible order and a recording is an observed one, which is worth saying
   where it cannot be missed. */
#kind {
  padding: 0.02rem 0.4rem;
  border-radius: 100px;
  font-size: 0.66rem;
  white-space: nowrap;
  border: 1px solid var(--ramp-2);
  color: var(--ramp-2);
}
#kind.real { border-color: var(--ramp-0); color: var(--ramp-0); }

#stack {
  position: absolute;
  right: 0.6rem;
  top: 0.6rem;
  max-width: 17rem;
  padding: 0.3rem 0.5rem;
  border: 1px solid var(--grid);
  border-radius: 3px;
  background: var(--panel);
  font-family: var(--mono);
  font-size: 0.7rem;
  line-height: 1.45;
  pointer-events: none;
  display: none;
}
#stack.on { display: block; }
#stack div { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
#stack .deep { color: var(--dim); }
#stack .now { color: var(--accent); }
#stack .turns { color: var(--ramp-2); }

/* -- the detail panel ----------------------------------------------------- */

#crumbs {
  display: flex;
  flex-wrap: wrap;
  gap: 0.25rem;
  margin-bottom: 0.5rem;
  font-size: 0.72rem;
}
#crumbs button { padding: 0.05rem 0.3rem; font-size: 0.72rem; }

.title {
  font-family: var(--mono);
  font-size: 0.92rem;
  font-weight: 500;
  word-break: break-all;
}
.badges { display: flex; flex-wrap: wrap; gap: 0.25rem; margin: 0.35rem 0; }
.tag {
  padding: 0.02rem 0.35rem;
  border: 1px solid var(--grid);
  border-radius: 100px;
  font-size: 0.68rem;
  color: var(--dim);
}
.tag.warn { border-color: var(--ramp-2); color: var(--ramp-2); }
.tag.kind { border-color: var(--accent); color: var(--accent); }

.where {
  display: flex;
  align-items: center;
  gap: 0.3rem;
  font-family: var(--mono);
  font-size: 0.72rem;
  color: var(--dim);
  word-break: break-all;
}
.where button { padding: 0 0.25rem; font-size: 0.66rem; flex: none; }

.doc { margin: 0.45rem 0; color: var(--dim); font-size: 0.8rem; text-wrap: pretty; }
.sig {
  font-family: var(--mono);
  font-size: 0.74rem;
  color: var(--dim);
  word-break: break-all;
}

table { width: 100%; border-collapse: collapse; font-size: 0.78rem; }
th, td { padding: 0.1rem 0; text-align: left; vertical-align: top; }
th { font-weight: 400; color: var(--dim); }
td { font-family: var(--mono); text-align: right; }

/* A caller or callee: hovering one lights exactly that edge, clicking walks to it. */
.link {
  display: flex;
  align-items: baseline;
  gap: 0.3rem;
  width: 100%;
  padding: 0.08rem 0.2rem;
  border: 0;
  border-radius: 2px;
  background: none;
  color: var(--ink);
  font-family: var(--mono);
  font-size: 0.74rem;
  text-align: left;
  cursor: pointer;
}
.link:hover { background: var(--bg); color: var(--accent); }
.link .via {
  margin-left: auto;
  color: var(--dim);
  font-size: 0.66rem;
  font-family: system-ui, sans-serif;
  flex: none;
}
.link .via.guess { color: var(--ramp-2); }
.link .name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

.empty { color: var(--dim); font-size: 0.78rem; font-style: italic; }
.note { color: var(--dim); font-size: 0.72rem; margin: 0.3rem 0; text-wrap: pretty; }

@media (width < 62rem) {
  body { grid-template-columns: 1fr; grid-template-areas: "head" "stage" "play"; }
  #rail, #detail { display: none; }
}
</style>
</head>
<body>

<header>
  <h1>statsbadge <small id="scale"></small></h1>

  <span><label for="hot">hot</label>
    <select id="hot"></select></span>

  <input type="search" id="find" placeholder="find a name…" autocomplete="off" spellcheck="false">

  <span id="depth">
    <label for="axis">height</label>
    <select id="axis"></select>
    <label for="tilt">tilt</label>
    <input type="range" id="tilt" min="0" max="70" step="1" value="0" title="Shift-drag to orbit">
    <b id="tiltat">0&deg;</b>
    <label for="slab">band</label>
    <input type="range" id="slab" min="0" max="100" step="5" value="100"
           title="Show only the top of the axis - dims the rest, never filters it">
    <b id="slabat">all</b>
    <button id="flip" title="Plan view or three-quarter (1 and 2)">3D</button>
  </span>

  <button id="fit" title="Fit everything (f)">fit</button>

  <span id="legend">
    <div>
      <div id="ramp"></div>
      <div id="ticks"></div>
    </div>
  </span>
</header>

<div id="rail"></div>

<div id="stage">
  <canvas id="board"></canvas>
  <div id="tip"></div>
  <div id="hud"></div>
  <div id="stack"></div>
</div>

<div id="play">
  <select id="scene"></select>
  <span id="kind"></span>
  <button id="rewind" title="Back to the start (Home)">⏮</button>
  <button id="back" title="One call back (left arrow)">◀</button>
  <button id="go" title="Play or pause (space)">▶</button>
  <button id="fwd" title="One call on (right arrow)">▶|</button>
  <select id="speed" title="Calls a second"></select>
  <label class="check" id="followbox" title="Let the shown band track the innermost frame">
    <input type="checkbox" id="follow"><span>follow</span></label>
  <input type="range" id="scrub" min="0" max="0" value="0">
  <span class="what" id="progress"></span>
</div>

<div id="detail"></div>

<script id="graph" type="application/json">/*__GRAPH__*/</script>
<script>/*__VIEWER__*/</script>
</body>
</html>

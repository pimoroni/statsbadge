name: Publish clock

# Publishes statsbadge-clock to PyPI, using trusted publishing: PyPI trusts this workflow via
# OIDC, so there is no long-lived API token to store or leak. Configure it once at
# pypi.org/manage/project/statsbadge-clock/settings/publishing/ with this repository, this
# workflow filename, and the `pypi` environment.
#
# One workflow per package rather than one reusable one called three times: PyPI matches on the
# filename of the workflow that runs, and a publisher that will not authenticate is a thing you
# find out at the moment of publishing.
#
# Four packages share this repository, so a release says which one it is for by its tag:
# clock-v0.1.0 publishes the clock and nothing else. The plain vN.N.N tags are statsbadge's own.
on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

env:
  PACKAGE: statsbadge-clock
  DIRECTORY: extensions/statsbadge-clock
  TAG_PREFIX: clock-v

jobs:
  publish:
    name: Build and publish to PyPI
    # A release for another package in this repository is not this workflow's business.
    if: >
      github.event_name == 'workflow_dispatch'
      || startsWith(github.event.release.tag_name, 'clock-v')
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write # for trusted publishing

    steps:
      - uses: actions/checkout@v7

      # setup-uv publishes no v9 tag, only exact versions
      - uses: astral-sh/setup-uv@v9.0.0
        with:
          version: "0.9.2"

      - name: Check the version matches the tag
        # A release tagged clock-v0.2.0 publishing 0.1.0 is the kind of thing you only notice
        # after it is on PyPI and immutable.
        working-directory: ${{ env.DIRECTORY }}
        run: |
          TAG="${GITHUB_REF_NAME#$TAG_PREFIX}"
          VERSION="$(uv run --no-project python -c \
            'import tomllib,pathlib;print(tomllib.loads(pathlib.Path("pyproject.toml").read_text())["project"]["version"])')"
          echo "tag=$TAG project=$VERSION"
          if [ "$GITHUB_REF_NAME" = "$TAG" ]; then
            echo "::error::$GITHUB_REF_NAME is not a $TAG_PREFIX tag"
            exit 1
          fi
          if [ -n "$TAG" ] && [ "$TAG" != "$VERSION" ]; then
            echo "::error::tag $TAG does not match $PACKAGE version $VERSION"
            exit 1
          fi

      # No bytecode step: an extension's badge-side module ships as source and the badge
      # compiles it, so there is nothing to cross-compile here.
      - name: Build
        working-directory: ${{ env.DIRECTORY }}
        run: uv build

      - name: Publish
        working-directory: ${{ env.DIRECTORY }}
        run: uv publish --trusted-publishing always

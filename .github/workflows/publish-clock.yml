name: Publish clock

# Publishes statsbadge-clock to PyPI from a clock-vN.N.N release tag. The release scheme,
# the trusted-publishing setup and why each package has a workflow file to itself are under
# Packaging in DEVELOPMENT.md.
on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

env:
  PACKAGE: statsbadge-clock
  DIRECTORY: extensions/statsbadge-clock
  TAG_PREFIX: clock-v

jobs:
  publish:
    name: Build and publish to PyPI
    if: >
      github.event_name == 'workflow_dispatch'
      || startsWith(github.event.release.tag_name, 'clock-v')
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write # for trusted publishing

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # setup-uv publishes no v9 tag, only exact versions
      - uses: astral-sh/setup-uv@v9.0.0
        with:
          version: "0.9.2"

      - name: Build
        working-directory: ${{ env.DIRECTORY }}
        run: uv build

      - name: Check the built version is the tag
        working-directory: ${{ env.DIRECTORY }}
        run: |
          TAG="${GITHUB_REF_NAME#$TAG_PREFIX}"
          BUILT="$(ls dist/*.whl | head -1 | cut -d- -f2)"
          echo "tag=$TAG built=$BUILT"
          if [ "$GITHUB_REF_NAME" != "$TAG" ] && [ "$TAG" != "$BUILT" ]; then
            echo "::error::built $BUILT from tag $TAG - check pattern-prefix, or whether the"
            echo "::error::checkout could see the tag at all"
            exit 1
          fi

      - name: Publish
        working-directory: ${{ env.DIRECTORY }}
        run: uv publish --trusted-publishing always

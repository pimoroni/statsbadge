name: Publish

# Publishes statsbadge to PyPI from a plain vN.N.N release tag. The release scheme, the
# trusted-publishing setup and why each package has a workflow file to itself are under
# Packaging in DEVELOPMENT.md.
on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    name: Build and publish to PyPI
    if: >
      github.event_name == 'workflow_dispatch'
      || startsWith(github.event.release.tag_name, 'v')
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write # for trusted publishing

    env:
      TUFTY_REPO: pimoroni/tufty2350
      TUFTY_REF: feature/align-v3

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # setup-uv publishes no v9 tag, only exact versions
      - uses: astral-sh/setup-uv@v9.0.0
        with:
          version: "0.9.2"

      - name: Read the pinned MicroPython
        shell: bash
        run: |
          curl -fsSL "https://raw.githubusercontent.com/$TUFTY_REPO/$TUFTY_REF/ci/micropython.sh" \
            | grep -E '^MICROPYTHON_(FLAVOUR|VERSION)=' | tr -d '"' | tee -a "$GITHUB_ENV"

      - name: Cache mpy-cross
        id: mpy-cross
        uses: actions/cache@v6
        with:
          path: mpy-cross
          key: mpy-cross-${{ env.MICROPYTHON_FLAVOUR }}-${{ env.MICROPYTHON_VERSION }}

      - name: Build mpy-cross
        if: steps.mpy-cross.outputs.cache-hit != 'true'
        run: |
          git clone --depth 1 --branch "$MICROPYTHON_VERSION" \
            "https://github.com/$MICROPYTHON_FLAVOUR/micropython" micropython
          make -C micropython/mpy-cross -j"$(nproc)"
          mkdir -p mpy-cross
          cp micropython/mpy-cross/build/mpy-cross mpy-cross/

      - name: Compile the app into the package
        run: MPY_CROSS=mpy-cross/mpy-cross
             ci/build-mpy.sh src/statsbadge/badge_app src/statsbadge/badge_app/mpy

      - run: uv build

      - name: Check the built version is the tag
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          BUILT="$(ls dist/*.whl | head -1 | cut -d- -f2)"
          echo "tag=$TAG built=$BUILT"
          if [ "$GITHUB_REF_NAME" != "$TAG" ] && [ "$TAG" != "$BUILT" ]; then
            echo "::error::built $BUILT from tag $TAG - check whether the checkout could see it"
            exit 1
          fi

      - name: Publish
        run: uv publish --trusted-publishing always

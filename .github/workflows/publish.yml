name: Publish

# Publishes to PyPI on a published release, using trusted publishing: PyPI trusts this
# workflow via OIDC, so there is no long-lived API token to store or leak. Configure it
# once at pypi.org/manage/project/statsbadge/settings/publishing/ with this repository,
# this workflow filename, and the `pypi` environment.
#
# Four packages share this repository and each has a workflow of its own, told apart by the
# release tag: vN.N.N is statsbadge, and clock-, iss- and quakes-vN.N.N are the extensions.
on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    name: Build and publish to PyPI
    # A release for an extension in this repository is not this workflow's business.
    if: >
      github.event_name == 'workflow_dispatch'
      || startsWith(github.event.release.tag_name, 'v')
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write # for trusted publishing

    env:
      TUFTY_REPO: pimoroni/tufty2350
      TUFTY_REF: feature/align-v3

    steps:
      - uses: actions/checkout@v7

      # setup-uv publishes no v9 tag, only exact versions
      - uses: astral-sh/setup-uv@v9.0.0
        with:
          version: "0.9.2"

      - name: Check the version matches the tag
        # A release tagged v0.2.0 publishing 0.1.0 is the kind of thing you only notice
        # after it is on PyPI and immutable.
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          VERSION="$(uv run --no-project python -c \
            'import tomllib,pathlib;print(tomllib.loads(pathlib.Path("pyproject.toml").read_text())["project"]["version"])')"
          echo "tag=$TAG project=$VERSION"
          if [ -n "$TAG" ] && [ "$TAG" != "$VERSION" ]; then
            echo "::error::tag $TAG does not match pyproject version $VERSION"
            exit 1
          fi

      - name: Read the pinned MicroPython
        shell: bash
        run: |
          curl -fsSL "https://raw.githubusercontent.com/$TUFTY_REPO/$TUFTY_REF/ci/micropython.sh" \
            | grep -E '^MICROPYTHON_(FLAVOUR|VERSION)=' | tr -d '"' | tee -a "$GITHUB_ENV"

      - name: Cache mpy-cross
        id: mpy-cross
        uses: actions/cache@v6
        with:
          path: mpy-cross
          key: mpy-cross-${{ env.MICROPYTHON_FLAVOUR }}-${{ env.MICROPYTHON_VERSION }}

      - name: Build mpy-cross
        if: steps.mpy-cross.outputs.cache-hit != 'true'
        run: |
          git clone --depth 1 --branch "$MICROPYTHON_VERSION" \
            "https://github.com/$MICROPYTHON_FLAVOUR/micropython" micropython
          make -C micropython/mpy-cross -j"$(nproc)"
          mkdir -p mpy-cross
          cp micropython/mpy-cross/build/mpy-cross mpy-cross/

      # Into the package, so `statsbadge install` uses bytecode without being asked. The
      # .py sources ship too and are the fallback on different firmware.
      - name: Compile the app into the package
        run: MPY_CROSS=mpy-cross/mpy-cross ENTRY_MPY=1
             ci/build-mpy.sh src/statsbadge/badge_app src/statsbadge/badge_app/mpy

      - run: uv build

      - name: Publish
        run: uv publish --trusted-publishing always

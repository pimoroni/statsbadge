name: CI

on:
  push:
    branches: [main]
  pull_request:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

env:
  UV_VERSION: "0.9.2"

jobs:
  check:
    name: Lint and test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      # setup-uv publishes no v9 tag, only exact versions
      - uses: astral-sh/setup-uv@v9.0.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true

      - name: Install
        run: |
          uv sync --all-extras
          uv pip install --no-deps ./extensions/statsbadge-clock

      # The badge compiles these from source when the app is launched, where a syntax
      # error is a crash dialog and nothing else.
      - name: Check the app is whole and parses
        run: uv run python tools/check_app.py

      - name: Lint
        run: uv run ruff check --config ci/ruff.toml src tools tests extensions

      - name: Server, auth and framing tests
        run: uv run python tests/test_core.py

      # Catches a source that cannot even be imported on a clean machine.
      - name: Probe this host
        run: uv run statsbadge probe

  build:
    name: Build the wheel
    runs-on: ubuntu-latest
    needs: check

    env:
      TUFTY_REPO: pimoroni/tufty2350
      TUFTY_REF: feature/align-v3

    steps:
      - uses: actions/checkout@v7

      # setup-uv publishes no v9 tag, only exact versions
      - uses: astral-sh/setup-uv@v9.0.0
        with:
          version: ${{ env.UV_VERSION }}

      - name: Read the pinned MicroPython
        shell: bash
        run: |
          curl -fsSL "https://raw.githubusercontent.com/$TUFTY_REPO/$TUFTY_REF/ci/micropython.sh" \
            | grep -E '^MICROPYTHON_(FLAVOUR|VERSION)=' | tr -d '"' | tee -a "$GITHUB_ENV"

      - name: Cache mpy-cross
        id: mpy-cross
        uses: actions/cache@v6
        with:
          path: mpy-cross
          key: mpy-cross-${{ env.MICROPYTHON_FLAVOUR }}-${{ env.MICROPYTHON_VERSION }}

      - name: Build mpy-cross
        if: steps.mpy-cross.outputs.cache-hit != 'true'
        run: |
          git clone --depth 1 --branch "$MICROPYTHON_VERSION" \
            "https://github.com/$MICROPYTHON_FLAVOUR/micropython" micropython
          make -C micropython/mpy-cross -j"$(nproc)"
          mkdir -p mpy-cross
          cp micropython/mpy-cross/build/mpy-cross mpy-cross/

      # Into the package, so `statsbadge install` uses bytecode without being asked. The
      # .py sources ship too and are the fallback on different firmware.
      - name: Compile the app into the package
        run: MPY_CROSS=mpy-cross/mpy-cross ENTRY_MPY=1
             ci/build-mpy.sh src/statsbadge/badge_app src/statsbadge/badge_app/mpy

      - run: uv build
      - run: uv build ./extensions/statsbadge-clock --out-dir dist

      # An installed wheel has to carry the badge app, or `statsbadge install` cannot
      # put anything on a badge.
      - name: Check the wheel carries the badge app and the web UI
        run: |
          uv venv /tmp/check
          uv pip install --python /tmp/check/bin/python dist/statsbadge-*.whl
          /tmp/check/bin/python - <<'PY'
          import os
          from statsbadge import install, server
          app = install.app_source_dir()
          files = set(os.listdir(app))
          missing = {"__init__.py", "icon.png", "draw.py", "look.py", "net.py",
                     "pages.py", "setup.py"} - files
          assert not missing, f"missing from the wheel: {missing}"
          assert os.path.isfile(os.path.join(server.STATIC_DIR, "index.html"))
          built = install.packaged_mpy_dir()
          assert built, "the wheel carries no precompiled app"
          print(f"wheel carries the app, the UI, and bytecode in {built}")
          PY

      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/*

  package-mpy:
    name: Pack a precompiled badge app
    runs-on: ubuntu-latest
    needs: check
    permissions:
      contents: write

    env:
      NAME: stats-${{ github.event.release.tag_name || github.sha }}-mpy
      # Where the badge's MicroPython is pinned. TUFTY_REF becomes main once
      # feature/align-v3 has landed. Deliberately the same shape as the job in
      # ../dots-badgeware, so the two stay recognisably one approach.
      TUFTY_REPO: pimoroni/tufty2350
      TUFTY_REF: feature/align-v3

    steps:
      - uses: actions/checkout@v7

      # MICROPYTHON_FLAVOUR and MICROPYTHON_VERSION, straight out of the firmware's own
      # CI script, so this never drifts from the badge it targets. Into GITHUB_ENV rather
      # than kept inside the build script, because the cache key needs them.
      - name: Read the pinned MicroPython
        shell: bash
        run: |
          curl -fsSL "https://raw.githubusercontent.com/$TUFTY_REPO/$TUFTY_REF/ci/micropython.sh" \
            | grep -E '^MICROPYTHON_(FLAVOUR|VERSION)=' | tr -d '"' | tee -a "$GITHUB_ENV"

      - name: Cache mpy-cross
        id: mpy-cross
        uses: actions/cache@v6
        with:
          path: mpy-cross
          key: mpy-cross-${{ env.MICROPYTHON_FLAVOUR }}-${{ env.MICROPYTHON_VERSION }}

      # Built from the same tree as the firmware, so the bytecode version and
      # sub-version are the ones the badge will load. Bytecode only, so the target
      # architecture does not come into it.
      - name: Build mpy-cross
        if: steps.mpy-cross.outputs.cache-hit != 'true'
        run: |
          git clone --depth 1 --branch "$MICROPYTHON_VERSION" \
            "https://github.com/$MICROPYTHON_FLAVOUR/micropython" micropython
          make -C micropython/mpy-cross -j"$(nproc)"
          mkdir -p mpy-cross
          cp micropython/mpy-cross/build/mpy-cross mpy-cross/

      # The same script a developer runs locally, so there is one code path. It compiles
      # with -s, refuses a mixed bytecode build, and refuses a .py left beside a .mpy -
      # which would win the import and silently undo the whole thing.
      - name: Compile it
        run: MPY_CROSS=mpy-cross/mpy-cross ci/build-mpy.sh src/statsbadge/badge_app build/mpy

      # The launcher wants the directory called `stats`.
      - name: Zip it
        run: |
          mkdir -p stage
          cp -r build/mpy stage/stats
          rm -f stage/stats/MPY_VERSION   # a build note, not something the badge needs
          cp README.md stage/
          (cd stage && zip -r "$GITHUB_WORKSPACE/$NAME.zip" stats README.md)
          unzip -l "$NAME.zip"

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ env.NAME }}
          path: stage

      - name: Attach to the release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v3
        with:
          files: ${{ env.NAME }}.zip

  package-app:
    name: Pack the badge app
    runs-on: ubuntu-latest
    needs: check
    permissions:
      contents: write # to attach the zip to a release

    env:
      NAME: stats-${{ github.event.release.tag_name || github.sha }}

    steps:
      - uses: actions/checkout@v7

      - name: Check the app is whole and parses
        run: python3 tools/check_app.py

      # The launcher wants the directory called `stats`, so stage it under that name.
      - name: Zip it
        run: |
          mkdir -p stage
          cp -r src/statsbadge/badge_app stage/stats
          cp README.md stage/
          cd stage && zip -r "../$NAME.zip" stats README.md \
            -x '*__pycache__*' -x '*.pyc' -x '*.DS_Store' -x 'stats/ext/*'
          cd .. && unzip -l "$NAME.zip"

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ env.NAME }}
          path: stage

      - name: Attach to the release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v3
        with:
          files: ${{ env.NAME }}.zip

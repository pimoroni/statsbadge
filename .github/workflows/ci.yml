name: CI

on:
  push:
    branches: [main]
  pull_request:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

env:
  UV_VERSION: "0.9.2"

jobs:
  check:
    name: Lint and test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - uses: astral-sh/setup-uv@v7
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true

      - name: Install
        run: |
          uv sync --all-extras
          uv pip install --no-deps ./extensions/statsbadge-clock

      # The badge compiles these from source when the app is launched, where a syntax
      # error is a crash dialog and nothing else.
      - name: Check the app is whole and parses
        run: uv run python tools/check_app.py

      - name: Lint
        run: uv run ruff check --config ci/ruff.toml src tools tests extensions

      - name: Server, auth and framing tests
        run: uv run python tests/test_core.py

      # Catches a source that cannot even be imported on a clean machine.
      - name: Probe this host
        run: uv run statsbadge probe

  build:
    name: Build the wheel
    runs-on: ubuntu-latest
    needs: check

    steps:
      - uses: actions/checkout@v5

      - uses: astral-sh/setup-uv@v7
        with:
          version: ${{ env.UV_VERSION }}

      - run: uv build
      - run: uv build ./extensions/statsbadge-clock --out-dir dist

      # An installed wheel has to carry the badge app, or `statsbadge install` cannot
      # put anything on a badge.
      - name: Check the wheel carries the badge app and the web UI
        run: |
          uv venv /tmp/check
          uv pip install --python /tmp/check/bin/python dist/statsbadge-*.whl
          /tmp/check/bin/python - <<'PY'
          import os
          from statsbadge import install, server
          app = install.app_source_dir()
          files = set(os.listdir(app))
          missing = {"__init__.py", "icon.png", "draw.py", "look.py", "net.py",
                     "pages.py", "setup.py"} - files
          assert not missing, f"missing from the wheel: {missing}"
          assert os.path.isfile(os.path.join(server.STATIC_DIR, "index.html"))
          print("wheel carries the app and the UI")
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/*

  package-app:
    name: Pack the badge app
    runs-on: ubuntu-latest
    needs: check
    permissions:
      contents: write # to attach the zip to a release

    env:
      NAME: stats-${{ github.event.release.tag_name || github.sha }}

    steps:
      - uses: actions/checkout@v5

      - name: Check the app is whole and parses
        run: python3 tools/check_app.py

      # The launcher wants the directory called `stats`, so stage it under that name.
      - name: Zip it
        run: |
          mkdir -p stage
          cp -r src/statsbadge/badge_app stage/stats
          cp README.md stage/
          cd stage && zip -r "../$NAME.zip" stats README.md \
            -x '*__pycache__*' -x '*.pyc' -x '*.DS_Store' -x 'stats/ext/*'
          cd .. && unzip -l "$NAME.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.NAME }}
          path: stage

      - name: Attach to the release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.NAME }}.zip

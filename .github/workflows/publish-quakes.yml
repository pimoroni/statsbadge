name: Publish quakes

# Publishes statsbadge-quakes to PyPI from a quakes-vN.N.N release tag. The release scheme,
# the trusted-publishing setup and why each package has a workflow file to itself are under
# Packaging in DEVELOPMENT.md.
on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    if: >
      github.event_name == 'workflow_dispatch'
      || startsWith(github.event.release.tag_name, 'quakes-v')
    uses: ./.github/workflows/extension-build.yml
    with:
      directory: extensions/statsbadge-quakes
      tag-prefix: quakes-v

  publish:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write # for trusted publishing

    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist

      # setup-uv publishes exact versions only, no major tag
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          version: "0.12.18"

      - run: uv publish --trusted-publishing always dist/*

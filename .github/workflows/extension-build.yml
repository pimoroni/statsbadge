name: Extension build

# Builds an extension for release and checks the version is the tag, uploading it as
# `dist`. The publishing itself stays in the caller: PyPI trusts a workflow file by name,
# and a reusable workflow cannot be the one it trusts.
on:
  workflow_call:
    inputs:
      directory:
        description: Where the extension sits in its repository
        type: string
        default: "."
      tag-prefix:
        description: What its release tags start with, ahead of the version
        type: string
        default: v

permissions:
  contents: read

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ inputs.directory }}

    steps:
      - uses: actions/checkout@v7
        with:
          # The tag is the version, so the build has to be able to see it.
          fetch-depth: 0

      # setup-uv publishes exact versions only, no major tag
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          version: "0.12.18"

      # Outside the extension's directory: an artifact path may not hold a "." or "..".
      - run: uv build --out-dir "$GITHUB_WORKSPACE/dist"

      # A build that cannot see the tag produces 0.0.0.postN.devN+hash rather than failing.
      # Skipped for a dispatch from a branch, where the ref is not a version at all.
      - name: Check the built version is the tag
        env:
          TAG_PREFIX: ${{ inputs.tag-prefix }}
        run: |
          TAG="${GITHUB_REF_NAME#$TAG_PREFIX}"
          BUILT="$(ls "$GITHUB_WORKSPACE"/dist/*.whl | head -1 | xargs basename | cut -d- -f2)"
          echo "tag=$TAG built=$BUILT"
          if [ "$GITHUB_REF_NAME" != "$TAG" ] && [ "$TAG" != "$BUILT" ]; then
            echo "::error::built $BUILT from tag $TAG - check the tag prefix, or whether the"
            echo "::error::checkout could see the tag at all"
            exit 1
          fi

      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/*

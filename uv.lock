    { name = "psutil" },
]

[package.optional-dependencies]
all = [
    { name = "mpremote" },
    { name = "nvidia-ml-py" },
    { name = "pyserial" },
]
install = [
    { name = "mpremote" },
    { name = "pyserial" },
]

    { name = "nvidia-ml-py" },
]

[package.dev-dependencies]
dev = [
    { name = "ruff" },
]
fonts = [
    { name = "freetype-py" },
    { name = "shapely" },
]

[package.metadata]
requires-dist = [
    { name = "mpremote", marker = "extra == 'all'", specifier = ">=1.22" },
    { name = "mpremote", marker = "extra == 'install'", specifier = ">=1.22" },
    { name = "nvidia-ml-py", marker = "extra == 'all'", specifier = ">=12" },
    { name = "nvidia-ml-py", marker = "extra == 'nvidia'", specifier = ">=12" },
    { name = "psutil", specifier = ">=5.9" },
    { name = "pyserial", marker = "extra == 'all'", specifier = ">=3.5" },
    { name = "pyserial", marker = "extra == 'install'", specifier = ">=3.5" },
]

[package.metadata.requires-dev]
dev = [{ name = "ruff", specifier = ">=0.6" }]
fonts = [
    { name = "freetype-py", specifier = ">=2.4" },
    { name = "shapely", specifier = ">=2.1" },
]

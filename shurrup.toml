# shurrup settings for stats-badgeware.

# The markdown defaults suit ordinary prose, where this repo's docs are denser. At 55 words
# a sentence, ninety of DEVELOPMENT.md's sat under the limit and still took a breath to
# read. Held to the code comment limit instead.
[rules.SHL009.markdown]
max_words = 40

[rules.SHL010.markdown]
max_breaks = 4
